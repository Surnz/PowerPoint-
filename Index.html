<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساخت پاورپوینت آموزش ترید</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d12;color:#f1f6f8;
 font-family:Tahoma,Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 min-height:100vh;padding:20px;text-align:center
}
.box{
 max-width:520px;width:100%;padding:35px 22px;
 background:#121b23;border:1px solid #263b42;
 border-radius:20px
}
h1{color:#5cff a4;color:#5cffa4;font-size:25px}
p{color:#b0bec5;line-height:2}
button{
 background:#5cffa4;color:#09130e;border:0;
 border-radius:12px;padding:17px 25px;
 font-size:17px;font-weight:bold;width:100%;
 margin-top:15px;cursor:pointer
}
button:disabled{opacity:.5}
#status{color:#5cffa4;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>آموزش ترید و ارز دیجیتال</h1>
<p>پاورپوینت آموزشی ۱۵ اسلایدی<br>
طراحی مشکی، سبز نئونی و طلایی<br>
مناسب ارائه و کلاس درس</p>
<button id="download" onclick="makePPT()">ساخت و دانلود پاورپوینت</button>
<div id="status"></div>
</div>

<script>
async function makePPT(){
 const btn=document.getElementById("download");
 const status=document.getElementById("status");
 btn.disabled=true;
 status.textContent="در حال ساخت پاورپوینت...";

 try{
 const pptx=new pptxgen();
 pptx.layout="LAYOUT_WIDE";
 pptx.author="Educational Presentation";
 pptx.subject="Crypto Trading";
 pptx.title="آموزش ترید و ارز دیجیتال";
 pptx.theme={
  headFontFace:"Tahoma",
  bodyFontFace:"Tahoma",
  lang:"fa-IR"
 };

 const C={
  bg:"090D12",panel:"121B23",
  green:"5CFFA4",gold:"F2C253",
  white:"F1F6F8",muted:"A3B3BC",
  red:"FF6767"
 };

 function addText(s,t,x,y,w,h,size=18,color=C.white,bold=false,align="right"){
  s.addText(t,{
   x,y,w,h,fontFace:"Tahoma",fontSize:size,
   color,bold,align,rtl:true,breakLine:false,
   valign:"mid",margin:0.08,
   paraSpaceAfterPt:9,fit:"shrink"
  });
 }

 function background(s,n){
  s.background={color:C.bg};
  s.addShape(pptx.ShapeType.rect,{
   x:0,y:0,w:.1,h:7.5,
   line:{color:C.green,transparency:100},
   fill:{color:C.green}
  });
  addText(s,`آموزش مقدماتی ترید و ارز دیجیتال     ${n}/15`,
   .5,7.13,12.2,.2,9,C.muted);
 }

 function card(s,x,y,w,h,title,body,accent=C.green){
  s.addShape(pptx.ShapeType.roundRect,{
   x,y,w,h,rectRadius:.12,
   fill:{color:C.panel},
   line:{color:"26363F",width:1}
  });
  addText(s,title,x+.2,y+.15,w-.4,.4,17,accent,true);
  addText(s,body,x+.2,y+.7,w-.4,h-.85,15,C.white);
 }

 function slide(n,title){
  const s=pptx.addSlide();
  background(s,n);
  addText(s,title,.75,.55,11.9,.8,27,C.white,true);
  return s;
 }

 const data=[
 {
 title:"در این ارائه چه می‌آموزیم؟",
 cards:[
 ["شناخت بازار","ارز دیجیتال، بلاکچین، کیف پول و صرافی"],
 ["تحلیل بازار","تحلیل تکنیکال، فاندامنتال و نمودارها"],
 ["معامله‌گری ایمن","مدیریت سرمایه، ریسک و امنیت"]
 ],
 note:"هدف اصلی: تصمیم‌گیری آگاهانه، نه پیش‌بینی قطعی قیمت."
 },
 {
 title:"ارز دیجیتال چیست؟",
 body:"ارز دیجیتال نوعی دارایی یا ابزار مبادله دیجیتال است که انتقال و ثبت آن معمولاً با فناوری رمزنگاری و شبکه‌های رایانه‌ای انجام می‌شود.\n\nبسیاری از رمزارزها بدون مدیریت یک بانک مرکزی واحد فعالیت می‌کنند.",
 cards:[
 ["دیجیتالی","در بستر شبکه و نرم‌افزار استفاده می‌شود."],
 ["قابل انتقال","می‌توان آن را میان کیف پول‌ها جابه‌جا کرد."],
 ["پرنوسان","قیمت آن ممکن است در مدت کوتاه تغییر زیادی کند."]
 ]
 },
 {
 title:"بلاکچین چگونه کار می‌کند؟",
 body:"بلاکچین نوعی دفترکل دیجیتال توزیع‌شده است؛ اطلاعات در بلوک‌ها ثبت و به‌صورت زنجیره‌ای به هم متصل می‌شوند.",
 cards:[
 ["۱. تراکنش","درخواست انتقال ثبت می‌شود."],
 ["۲. بررسی","شبکه تراکنش را اعتبارسنجی می‌کند."],
 ["۳. ثبت در بلوک","اطلاعات به زنجیره افزوده می‌شود."]
 ],
 note:"ویژگی‌ها: شفافیت، توزیع‌شدگی و دشواری دست‌کاری سوابق."
 },
 {
 title:"کوین و توکن چه تفاوتی دارند؟",
 cards:[
 ["کوین (Coin)","دارایی بومی یک بلاکچین است.\nمثال: بیت‌کوین در شبکه بیت‌کوین و اتر در شبکه اتریوم."],
 ["توکن (Token)","روی یک بلاکچین موجود ایجاد می‌شود و کاربردهای گوناگونی دارد.\nمثال: توکن‌های ساخته‌شده روی اتریوم."]
 ],
 note:"نام و نماد یک دارایی به‌تنهایی برای شناخت اعتبار یا ارزش آن کافی نیست."
 },
 {
 title:"کیف پول دیجیتال چیست؟",
 cards:[
 ["کیف پول گرم","به اینترنت متصل است؛ استفاده از آن آسان‌تر است اما در معرض تهدیدهای آنلاین قرار دارد."],
 ["کیف پول سرد","کلیدها را آفلاین نگهداری می‌کند؛ برای نگهداری بلندمدت می‌تواند مناسب باشد."]
 ],
 note:"عبارت بازیابی (Seed Phrase) را آفلاین و محرمانه نگه دارید و هرگز برای کسی ارسال نکنید."
 },
 {
 title:"صرافی ارز دیجیتال",
 cards:[
 ["ثبت‌نام و احراز هویت","قوانین و شرایط صرافی را بررسی کنید."],
 ["واریز دارایی","شبکه انتقال و آدرس را چندبار بررسی کنید."],
 ["ثبت سفارش","نوع سفارش، کارمزد و قیمت را بشناسید."]
 ],
 note:"اعتبار، امنیت، شفافیت کارمزد و پشتیبانی از معیارهای مهم انتخاب صرافی هستند."
 },
 {
 title:"انواع سفارش در بازار",
 cards:[
 ["Market | بازار","خرید یا فروش با بهترین قیمت موجود؛ سرعت اجرا بالاست اما قیمت نهایی ممکن است تغییر کند."],
 ["Limit | محدود","قیمت دلخواه تعیین می‌کنید؛ سفارش ممکن است اصلاً اجرا نشود."],
 ["Stop | شرطی","با رسیدن قیمت به سطح مشخص، سفارش فعال می‌شود."]
 ],
 note:"پیش از ثبت سفارش، مقدار، قیمت و کارمزد را کنترل کنید."
 },
 {
 title:"تحلیل تکنیکال و فاندامنتال",
 cards:[
 ["تحلیل تکنیکال","بررسی نمودار قیمت، حجم معاملات، روندها و الگوها برای ارزیابی رفتار بازار."],
 ["تحلیل فاندامنتال","بررسی کاربرد پروژه، فناوری، تیم، میزان پذیرش و اقتصاد توکنی."]
 ],
 note:"هیچ‌کدام پیش‌بینی قطعی ارائه نمی‌کنند؛ ترکیب آن‌ها می‌تواند دید کامل‌تری بدهد."
 },
 {
 title:"نمودار کندل‌استیک چیست؟",
 body:"هر کندل خلاصه‌ای از حرکت قیمت در یک بازه زمانی است:\n\n• قیمت باز شدن (Open)\n• قیمت بسته شدن (Close)\n• بیشترین قیمت (High)\n• کمترین قیمت (Low)\n\nبدنه فاصله باز و بسته شدن را نشان می‌دهد و سایه‌ها محدوده نوسان را.",
 note:"سبز: بسته‌شدن بالاتر از بازشدن | قرمز: بسته‌شدن پایین‌تر از بازشدن"
 },
 {
 title:"مدیریت سرمایه و ریسک",
 body:"قوانین مهم مدیریت ریسک:\n\n• با تمام سرمایه وارد یک معامله نشوید.\n• حد ضرر (Stop Loss) تعیین کنید.\n• از تصمیم‌گیری احساسی خودداری کنید.\n• نسبت سود به زیان را بررسی کنید.\n• فقط با سرمایه‌ای معامله کنید که توان از دست دادنش را دارید.",
 cards:[
 ["مثال ریسک ۱٪","سرمایه: ۱۰۰۰ دلار\nریسک برنامه‌ریزی‌شده: ۱۰ دلار\n\nلغزش قیمت ممکن است زیان واقعی را بیشتر کند."]
 ]
 },
 {
 title:"معاملات اسپات و فیوچرز",
 cards:[
 ["اسپات (Spot)","در این روش دارایی را خریداری می‌کنید و مالک آن می‌شوید.\n\nمثال: بیت‌کوین می‌خرید و نگهداری می‌کنید."],
 ["فیوچرز (Futures)","روی تغییرات قیمت قرارداد معامله می‌کنید و ممکن است از اهرم استفاده کنید.\n\nاهرم سود و زیان را بزرگ‌تر می‌کند."]
 ],
 note:"⚠ معاملات فیوچرز پرریسک هستند و ممکن است باعث از دست رفتن کل وجه تضمین شوند."
 },
 {
 title:"اشتباهات رایج در ترید",
 body:"۱. خرید ارز بدون تحقیق\n\n۲. ورود به معامله از روی هیجان\n\n۳. استفاده بیش از حد از اهرم\n\n۴. نداشتن برنامه معاملاتی\n\n۵. اعتماد به سیگنال‌های ناشناس\n\n۶. تلاش برای جبران سریع ضرر",
 note:"ترید موفق بیشتر از آنکه به شانس وابسته باشد، به آموزش، نظم و مدیریت ریسک نیاز دارد."
 },
 {
 title:"امنیت و جلوگیری از کلاهبرداری",
 cards:[
 ["مراقب این موارد باشید","لینک‌های جعلی\nپروژه‌های پانزی\nوعده سود تضمینی\nفروشندگان ناشناس سیگنال"],
 ["از دارایی محافظت کنید","عبارت بازیابی را به کسی ندهید\nاحراز هویت دومرحله‌ای فعال کنید\nآدرس و شبکه انتقال را بررسی کنید"]
 ],
 note:"قانون طلایی: هیچ فردی نمی‌تواند سود قطعی و تضمینی در بازار ارز دیجیتال را تضمین کند."
 },
 {
 title:"جمع‌بندی و نتیجه‌گیری",
 body:"مهم‌ترین نکات این آموزش:\n\n• شناخت ارزهای دیجیتال\n• یادگیری فناوری بلاکچین\n• تحلیل تکنیکال و فاندامنتال\n• مدیریت سرمایه و کنترل ریسک\n• رعایت امنیت دارایی‌ها\n• تمرین پیش از ورود به معاملات واقعی",
 note:"«اول یاد بگیر چگونه سرمایه‌ات را حفظ کنی؛ سپس به فکر کسب سود باش.»"
 }
 ];

 // اسلاید اول: جلد
 {
  const s=pptx.addSlide();
  background(s,1);
  addText(s,"راهنمای مقدماتی بازارهای مالی",1,1.1,11,.5,15,C.green,true);
  addText(s,"آشنایی با ترید\nو بازار ارزهای دیجیتال",1,2,11,1.7,36,C.white,true);
  addText(s,"از مفاهیم پایه تا مدیریت ریسک و امنیت سرمایه",1,4.3,11,.6,20,C.green,true);
  addText(s,"ارائه آموزشی | مناسب افراد تازه‌وارد",1,5.5,11,.5,15,C.muted);
  // نمودار کندل تزئینی
  const vals=[
   [2.4,1.0,C.green],[2.8,.8,C.red],
   [2.1,1.2,C.green],[2.5,.7,C.green],
   [1.8,1.0,C.red],[1.7,.9,C.green]
  ];
  vals.forEach((v,i)=>{
   let x=8+i*.65;
   s.addShape(pptx.ShapeType.line,{
    x:x+.2,y:2.1,w:0,h:1.8,
    line:{color:v[2],width:2}
   });
   s.addShape(pptx.ShapeType.rect,{
    x,y:v[0],w:.4,h:v[1],
    line:{color:v[2],transparency:100},
    fill:{color:v[2]}
   });
  });
 }

 // اسلایدهای ۲ تا ۱۵
 data.forEach((d,i)=>{
  const n=i+2;
  const s=slide(n,d.title);

  if(d.body){
   addText(s,d.body,.9,1.7,11.5,d.cards?2.7:4.4,18,C.white);
  }

  if(d.cards){
   const count=d.cards.length;
   const gap=.25;
   const w=(11.5-gap*(count-1))/count;
   const y=d.body?4.55:2.1;
   const h=d.body?1.45:2.8;

   d.cards.forEach((c,j)=>{
    const x=.9+j*(w+gap);
    card(s,x,y,w,h,c[0],c[1],
     j%2===0?C.green:C.gold);
   });
  }

  if(d.note){
   addText(s,d.note,.9,6.15,11.5,.65,14,C.gold,true,"center");
  }

  // نمودار کندل در اسلاید ۱۰
  if(n===10){
   const vals=[
    [2.3,1.0,C.green],[2.0,.8,C.red],
    [1.7,1.1,C.green],[2.4,.7,C.green],
    [1.9,.9,C.red],[1.5,1.0,C.green]
   ];
   vals.forEach((v,j)=>{
    let x=8+j*.65;
    s.addShape(pptx.ShapeType.line,{
     x:x+.2,y:1.9,w:0,h:2,
     line:{color:v[2],width:2}
    });
    s.addShape(pptx.ShapeType.rect,{
     x,y:v[0],w:.4,h:v[1],
     line:{color:v[2],transparency:100},
     fill:{color:v[2]}
    });
   });
  }
 });

 status.textContent="پاورپوینت آماده شد!";
 await pptx.writeFile({fileName:"Crypto_Trading_Presentation.pptx"});
 }catch(e){
  console.error(e);
  status.textContent="خطا: "+e.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
